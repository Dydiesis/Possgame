name: Build Nexus Android APK

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships with Android command-line tools. Do not use
      # android-actions/setup-android@v3: it requests the removed 'tools' package.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "Android sdkmanager was not found in $SDK_DIR" >&2
            exit 1
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and APK build
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PossGame-Nexus-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
