name: PossMiner - Crea APK
on:
  push:
    branches: [possminer]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Estrai il progetto dal singolo ZIP
        run: |
          rm -rf progetto
          mkdir -p progetto
          unzip -q -o PossMiner-project.zip -d progetto
          test -f progetto/PossMiner/app/build.gradle
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Installa Android 35
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compila PossMiner
        working-directory: progetto/PossMiner
        run: gradle :app:assembleDebug --stacktrace
      - name: Pubblica Artifact 1
        uses: actions/upload-artifact@v4
        with:
          name: Artifact 1
          path: progetto/PossMiner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
